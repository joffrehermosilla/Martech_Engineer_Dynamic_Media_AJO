<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<title>Login C · Móvil</title>
<script src="efba8aef.javascript"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#EEECE6;font-family:'IBM Plex Sans',system-ui,sans-serif}
a{color:#1E3FD0}a:hover{color:#152E9E}
*,*::before,*::after{box-sizing:border-box}
.ico-lead{position:absolute;left:16px;top:16px;width:20px;height:20px;color:#4A4943;pointer-events:none}
.inp{display:block;width:100%;height:52px;margin:0;padding:0 16px 0 48px;background:#FFFFFF;border:1px solid #0E0E0C;border-radius:2px;color:#0E0E0C;font-family:'IBM Plex Mono',monospace;font-size:16px;outline:none;transition:border-color .15s ease,box-shadow .15s ease}
.inp.pw{padding-right:56px}
.inp::placeholder{color:#6B6A63;opacity:1}
.inp:focus-visible{border-color:#1E3FD0;box-shadow:0 0 0 1px #1E3FD0,0 0 0 5px rgba(30,63,208,.16)}
.inp.is-error{border-color:#B42318;box-shadow:0 0 0 1px #B42318}
.inp:disabled{background:#F1EFE9;color:#4A4943;cursor:not-allowed}
.eye{position:absolute;right:4px;top:4px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;padding:0;background:transparent;border:0;border-radius:2px;color:#4A4943;cursor:pointer}
.eye:focus-visible{outline:2px solid #1E3FD0;outline-offset:-2px}
.eye:disabled{color:#8A877E;cursor:not-allowed}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:56px;padding:0 20px;background:#1E3FD0;border:0;border-radius:2px;color:#FFFFFF;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:16px;font-weight:600;cursor:pointer;transition:background-color .15s ease}
.btn:active:not(:disabled){background:#152E9E}
.btn:focus-visible{outline:2px solid #0E0E0C;outline-offset:3px}
.btn:disabled{background:#4A63D6;cursor:progress}
.demo{border-top:1px solid #0E0E0C}
.demo>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:52px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;color:#4A4943}
.demo>summary::-webkit-details-marker{display:none}
.demo>summary:focus-visible{outline:2px solid #1E3FD0;outline-offset:2px}
.demo .chev{transition:transform .2s ease}
.demo[open] .chev{transform:rotate(180deg)}
.demo-row{display:grid;grid-template-columns:112px minmax(0,1fr);align-items:center;column-gap:12px;width:100%;min-height:56px;padding:8px 8px;background:transparent;border:0;border-top:1px solid #D6D3CA;color:#0E0E0C;font-family:'IBM Plex Mono',monospace;font-size:14px;text-align:left;cursor:pointer}
.demo-row:active:not(:disabled){background:#EEECE6}
.demo-row:focus-visible{outline:2px solid #1E3FD0;outline-offset:-2px}
.demo-row:disabled{opacity:.5;cursor:not-allowed}
.role{justify-self:start;display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.06em;line-height:1;padding:5px 8px;border-radius:2px}
.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}.inp,.btn,.demo .chev{transition:none}}
</style>
</helmet>
<div style="width: 375px; height: 812px; overflow: hidden; display: flex; flex-direction: column; background: #F8F7F3; color: #0E0E0C; font-family: 'IBM Plex Sans', system-ui, sans-serif">

  <header style="height: 56px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: #EEECE6; border-bottom: 1px solid #0E0E0C">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="24" height="24" sc-camel-view-box="0 0 28 28" fill="none" aria-hidden="true"><rect x="1.75" y="9.75" width="6.5" height="8.5" stroke="#0E0E0C" stroke-width="1.5"></rect><rect x="10.75" y="9.75" width="6.5" height="8.5" stroke="#0E0E0C" stroke-width="1.5"></rect><rect x="19" y="9" width="8" height="10" fill="#0E0E0C"></rect></svg>
      <span style="font-size: 16px; font-weight: 700; letter-spacing: -0.01em">DAM Platform</span>
    </div>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; color: #4A4943">Agent Hub v2.0</span>
  </header>

  <ol aria-label="Flujo de la plataforma" style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #EEECE6; border-bottom: 1px solid #0E0E0C">
    <li style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-right: 1px solid #0E0E0C"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #4A4943">01</span><span style="font-size: 14px; font-weight: 600; color: #4A4943">Generar</span></li>
    <li style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-right: 1px solid #0E0E0C"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #4A4943">02</span><span style="font-size: 14px; font-weight: 600; color: #4A4943">Gobernar</span></li>
    <li aria-current="step" style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; background: #0E0E0C; color: #F8F7F3"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #D6D3CA">03 · usted</span><span style="font-size: 14px; font-weight: 600">Aprobar</span></li>
  </ol>

  <main style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 24px; padding: 28px 24px 24px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 26px; line-height: 1.15; font-weight: 600; letter-spacing: -0.02em">Aprobar y publicar</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #4A4943">Ninguna pieza llega a Adobe Dynamic Media sin aprobación humana. Inicie sesión para continuar.</p>
    </div>

    <form novalidate="novalidate" style="margin: 0; display: flex; flex-direction: column; gap: 18px">
      <sc-if value="{{hasError}}" hint-placeholder-val="{{ false }}">
        <div id="cm-error" role="alert" style="display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px; background: #FBEAE7; border: 1px solid #B42318; border-radius: 2px; color: #8C1D13; font-size: 14px; line-height: 1.45">
          <svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5"></path><path d="M12 16.5h.01"></path></svg>
          <span>{{error}}</span>
        </div>
      </sc-if>
      <sc-if value="{{hasOk}}" hint-placeholder-val="{{ false }}">
        <div role="status" style="display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px; background: #E6F4EC; border: 1px solid #1C7C4A; border-radius: 2px; color: #145C37; font-size: 14px; line-height: 1.45">
          <svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M8.5 12.5l2.5 2.5 4.5-5"></path></svg>
          <span>{{ok}}</span>
        </div>
      </sc-if>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="cm-user" style="font-size: 14px; font-weight: 600">Usuario</label>
        <div style="position: relative">
          <svg class="ico-lead" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"></path></svg>
          <input id="cm-user" class="inp {{userCls}}" type="text" name="username" autocomplete="username" placeholder="ej. martech1" value="{{user}}" sc-camel-on-change="{{onUser}}" sc-camel-on-key-down="{{onKey}}" disabled="{{loading}}" aria-invalid="{{userInvalid}}" aria-describedby="cm-error">
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="cm-pass" style="font-size: 14px; font-weight: 600">Contraseña</label>
        <div style="position: relative">
          <svg class="ico-lead" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10.5" width="16" height="10.5" rx="2"></rect><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"></path></svg>
          <input id="cm-pass" class="inp pw {{passCls}}" type="{{passType}}" name="password" autocomplete="current-password" placeholder="Contraseña" value="{{pass}}" sc-camel-on-change="{{onPass}}" sc-camel-on-key-down="{{onKey}}" disabled="{{loading}}" aria-invalid="{{passInvalid}}" aria-describedby="cm-error">
          <button type="button" class="eye" sc-camel-on-click="{{toggleShow}}" disabled="{{loading}}" aria-pressed="{{show}}" aria-controls="cm-pass" aria-label="{{eyeLabel}}">
            <sc-if value="{{hide}}" hint-placeholder-val="{{ true }}">
              <svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </sc-if>
            <sc-if value="{{show}}" hint-placeholder-val="{{ false }}">
              <svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"></path><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17.7 17.7 0 0 1-3.2 4.2"></path><path d="M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a10.5 10.5 0 0 0 5.4-1.5"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
            </sc-if>
          </button>
        </div>
      </div>

      <button type="button" class="btn" sc-camel-on-click="{{submit}}" disabled="{{loading}}" aria-busy="{{loading}}">
        <sc-if value="{{idle}}" hint-placeholder-val="{{ true }}">
          <span style="display: flex; align-items: center; gap: 12px">Ingresar a la Plataforma<svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></span>
        </sc-if>
        <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
          <span style="display: flex; align-items: center; gap: 12px"><svg class="spin" width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity="0.3" stroke-width="2.5"></circle><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></path></svg>Verificando…</span>
        </sc-if>
      </button>
    </form>

    <details class="demo">
      <summary>
        <span style="display: flex; align-items: center; gap: 10px"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17l6-5-6-5"></path><path d="M12 19h8"></path></svg>Modo demo · 4 cuentas</span>
        <svg class="chev" width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </summary>
      <div style="display: flex; flex-direction: column">
        <button type="button" class="demo-row" sc-camel-on-click="{{fillAdmin}}" disabled="{{loading}}"><span class="role" style="color: #F8F7F3; background: #0E0E0C"><svg width="12" height="12" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="M10.8 12.2L20 3"></path><path d="M16 7l3 3"></path></svg>ADMIN</span><span style="display: flex; flex-direction: column; gap: 2px"><span>admin</span><span style="font-size: 12px; color: #4A4943">Admin2026!</span></span></button>
        <button type="button" class="demo-row" sc-camel-on-click="{{fillMartech}}" disabled="{{loading}}"><span class="role" style="color: #0B5F6B; background: #DCEEF0"><svg width="12" height="12" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 8l-4 4 4 4"></path><path d="M16 8l4 4-4 4"></path></svg>MARTECH</span><span style="display: flex; flex-direction: column; gap: 2px"><span>martech1</span><span style="font-size: 12px; color: #4A4943">Martech2026!</span></span></button>
        <button type="button" class="demo-row" sc-camel-on-click="{{fillDesigner}}" disabled="{{loading}}"><span class="role" style="color: #6B3591; background: #EFE5F5"><svg width="12" height="12" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>VCD</span><span style="display: flex; flex-direction: column; gap: 2px"><span>designer1</span><span style="font-size: 12px; color: #4A4943">Design2026!</span></span></button>
        <button type="button" class="demo-row" sc-camel-on-click="{{fillViewer}}" disabled="{{loading}}"><span class="role" style="color: #4A4943; background: #E3E1DA"><svg width="12" height="12" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>VIEWER</span><span style="display: flex; flex-direction: column; gap: 2px"><span>viewer1</span><span style="font-size: 12px; color: #4A4943">View2026!</span></span></button>
      </div>
    </details>

    <p style="margin: auto 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #4A4943">Acceso restringido a usuarios autorizados</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:375,&quot;height&quot;:812}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { user: '', pass: '', show: false, error: '', errUser: false, errPass: false, loading: false, ok: '' };
  }
  componentWillUnmount() { clearTimeout(this.timer); }
  renderVals() {
    const s = this.state;
    const ACC = {
      admin: { p: 'Admin2026!', r: 'ADMIN' },
      martech1: { p: 'Martech2026!', r: 'MARTECH' },
      designer1: { p: 'Design2026!', r: 'VCD' },
      viewer1: { p: 'View2026!', r: 'VIEWER' }
    };
    const clear = { error: '', errUser: false, errPass: false, ok: '' };
    const submit = (e) => {
      if (e && e.preventDefault) e.preventDefault();
      if (this.state.loading) return;
      const u = this.state.user.trim();
      const p = this.state.pass;
      if (!u || !p) {
        this.setState({ error: 'Ingrese usuario y contraseña.', errUser: !u, errPass: !p, ok: '' });
        return;
      }
      this.setState(Object.assign({}, clear, { loading: true }));
      clearTimeout(this.timer);
      this.timer = setTimeout(() => {
        const acc = ACC[u];
        if (!acc) this.setState({ loading: false, error: 'Usuario no encontrado.', errUser: true });
        else if (acc.p !== p) this.setState({ loading: false, error: 'Contraseña incorrecta.', errPass: true });
        else this.setState({ loading: false, ok: 'Acceso concedido: ' + u + ' · rol ' + acc.r + '.' });
      }, 1200);
    };
    const fill = (u) => () => {
      if (this.state.loading) return;
      this.setState(Object.assign({}, clear, { user: u, pass: ACC[u].p }));
    };
    return {
      user: s.user,
      pass: s.pass,
      onUser: (e) => this.setState(Object.assign({}, clear, { user: e.target.value })),
      onPass: (e) => this.setState(Object.assign({}, clear, { pass: e.target.value })),
      onKey: (e) => { if (e.key === 'Enter') submit(e); },
      submit: submit,
      show: s.show,
      hide: !s.show,
      passType: s.show ? 'text' : 'password',
      eyeLabel: s.show ? 'Ocultar contraseña' : 'Mostrar contraseña',
      toggleShow: () => this.setState({ show: !this.state.show }),
      hasError: !!s.error,
      error: s.error,
      hasOk: !!s.ok,
      ok: s.ok,
      userCls: s.errUser ? 'is-error' : '',
      passCls: s.errPass ? 'is-error' : '',
      userInvalid: s.errUser,
      passInvalid: s.errPass,
      loading: s.loading,
      idle: !s.loading,
      fillAdmin: fill('admin'),
      fillMartech: fill('martech1'),
      fillDesigner: fill('designer1'),
      fillViewer: fill('viewer1')
    };
  }
}
</script>


</body></html>
