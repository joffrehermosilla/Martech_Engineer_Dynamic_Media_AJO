version: '3.8'

services:
  martech-agent-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: martech-engineer-dynamic-media-ajo
    ports:
      - "3000:3000"  # Agent Hub & Interactive Dashboard
      - "3001:3001"  # MCP Server
      - "3002:3002"  # Flow Studio Standalone
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - photocraft_jobs:/app/photocraft/jobs
    restart: unless-stopped

  # TEMPORAL: gateway de IA para no depender de las cuotas de una sola API.
  # Solo arranca si se pide: docker compose --env-file .env.local --profile omniroute up -d
  # Dashboard en http://localhost:20128 (solo accesible desde esta máquina).
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: martech-omniroute
    profiles: ["omniroute"]
    ports:
      - "127.0.0.1:20128:20128"
    environment:
      - DATA_DIR=/data
      - INITIAL_PASSWORD=${OMNIROUTE_INITIAL_PASSWORD:-}
    volumes:
      - omniroute_data:/data
    restart: unless-stopped

volumes:
  photocraft_jobs:
    driver: local
  omniroute_data:
    driver: local
