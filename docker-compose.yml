version: '3.8'

services:
  martech-agent-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: martech-engineer-dynamic-media-ajo
    ports:
      - "3000:3000"  # Agent Hub & Interactive Dashboard
      - "3001:3001"  # MCP Server
      - "3002:3002"  # Flow Studio Standalone
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - photocraft_jobs:/app/photocraft/jobs
    restart: unless-stopped

volumes:
  photocraft_jobs:
    driver: local
